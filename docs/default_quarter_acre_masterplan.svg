<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1210" viewBox="0 0 900 1210" role="img" aria-labelledby="title desc">
  <title id="title">Garden Operating System default quarter-acre masterplan v0.6</title>
  <desc id="desc">North-up schematic of the 90 by 121 foot Richmond Kentucky quarter-acre garden with greenhouse, kitchen beds, rotation blocks, permanent crops, flowers, roses, paths and pumpkin flex area.</desc>
  <rect x="0" y="0" width="900" height="1210" fill="#f5f1e8" stroke="#222" stroke-width="4"/>
  <text x="450" y="24" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">NORTH</text>
  <text x="450" y="1194" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700">SOUTH / MAIN ENTRANCE</text>

  <!-- Primary paths -->
  <rect x="430" y="40" width="40" height="1130" fill="#d8d0c4" opacity="0.95"/>
  <rect x="40" y="600" width="820" height="40" fill="#d8d0c4" opacity="0.95"/>
  <text x="450" y="580" text-anchor="middle" font-family="sans-serif" font-size="13">MAIN CART SPINE</text>

  <!-- Greenhouse/work -->
  <rect x="60" y="40" width="160" height="240" rx="6" fill="#cbe8ef" stroke="#245" stroke-width="3"/>
  <text x="140" y="145" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700">GH-01</text>
  <text x="140" y="167" text-anchor="middle" font-family="sans-serif" font-size="13">16 × 24 greenhouse</text>
  <rect x="40" y="280" width="240" height="120" rx="4" fill="#e4eef1" stroke="#567" stroke-width="2"/>
  <text x="160" y="340" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700">GH-WORK</text>
  <text x="160" y="360" text-anchor="middle" font-family="sans-serif" font-size="12">hardening / potting apron</text>

  <!-- Kitchen beds -->
  <g fill="#b9d8a7" stroke="#345b2c" stroke-width="2" font-family="sans-serif" font-size="12">
    <rect x="480" y="40" width="40" height="160"/><text x="500" y="125" text-anchor="middle">K01</text>
    <rect x="560" y="40" width="40" height="160"/><text x="580" y="125" text-anchor="middle">K02</text>
    <rect x="640" y="40" width="40" height="160"/><text x="660" y="125" text-anchor="middle">K03</text>
    <rect x="720" y="160" width="120" height="40"/><text x="780" y="185" text-anchor="middle">K04</text>
    <rect x="720" y="240" width="40" height="160"/><text x="740" y="325" text-anchor="middle">K05</text>
    <rect x="800" y="280" width="40" height="120"/><text x="820" y="345" text-anchor="middle">K06</text>
    <rect x="480" y="280" width="40" height="120"/><text x="500" y="345" text-anchor="middle">K07</text>
    <rect x="560" y="280" width="40" height="120"/><text x="580" y="345" text-anchor="middle">K08</text>
  </g>
  <text x="660" y="425" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700">KITCHEN GARDEN</text>

  <!-- Dry herbs and permanent edibles -->
  <rect x="40" y="440" width="240" height="160" fill="#d8d5a3" stroke="#655f28" stroke-width="2"/>
  <text x="160" y="520" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700">P03 DRY HERBS</text>
  <text x="160" y="541" text-anchor="middle" font-family="sans-serif" font-size="12">lavender / thyme / rosemary</text>
  <rect x="40" y="660" width="180" height="140" fill="#aacb8a" stroke="#38582d" stroke-width="2"/>
  <text x="130" y="730" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700">P01 ASPARAGUS</text>
  <rect x="250" y="660" width="150" height="120" fill="#c6d895" stroke="#536a2d" stroke-width="2"/>
  <text x="325" y="725" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700">P02 RHUBARB</text>

  <!-- Rotation blocks -->
  <g fill="#d7c39d" stroke="#6d5131" stroke-width="2" font-family="sans-serif" font-size="15" font-weight="700">
    <rect x="480" y="460" width="160" height="160"/><text x="560" y="545" text-anchor="middle">R1</text>
    <rect x="680" y="460" width="160" height="160"/><text x="760" y="545" text-anchor="middle">R2</text>
    <rect x="480" y="660" width="160" height="160"/><text x="560" y="745" text-anchor="middle">R3</text>
    <rect x="680" y="660" width="160" height="160"/><text x="760" y="745" text-anchor="middle">R4</text>
  </g>
  <text x="660" y="850" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700">ROTATION / FLEX FIELD</text>

  <!-- Flower garden -->
  <rect x="60" y="910" width="80" height="220" fill="#d8a8b5" stroke="#713646" stroke-width="2"/>
  <text x="100" y="1020" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700">FL01</text>
  <text x="100" y="1038" text-anchor="middle" font-family="sans-serif" font-size="11">dahlias</text>
  <rect x="170" y="910" width="100" height="220" fill="#e3b58d" stroke="#754a23" stroke-width="2"/>
  <text x="220" y="1020" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700">FL02</text>
  <text x="220" y="1038" text-anchor="middle" font-family="sans-serif" font-size="11">zinnia / cosmos</text>
  <rect x="300" y="910" width="110" height="220" fill="#c6b4db" stroke="#514269" stroke-width="2"/>
  <text x="355" y="1020" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700">FL03</text>
  <text x="355" y="1038" text-anchor="middle" font-family="sans-serif" font-size="11">perennial drift</text>

  <!-- Pumpkin/flex -->
  <rect x="470" y="900" width="210" height="180" fill="#e5c66e" stroke="#785f16" stroke-width="2"/>
  <text x="575" y="985" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700">F01 PUMPKIN / SQUASH RUN</text>
  <text x="575" y="1006" text-anchor="middle" font-family="sans-serif" font-size="11">vines routed away from spine</text>

  <!-- Rose focal points -->
  <g fill="#a51f2d" stroke="#5d0d16" stroke-width="2">
    <circle cx="390" cy="1140" r="13"/><circle cx="510" cy="1140" r="13"/><circle cx="410" cy="900" r="13"/>
  </g>
  <text x="450" y="1162" text-anchor="middle" font-family="sans-serif" font-size="12">paired red-rose entrance</text>
  <text x="405" y="880" text-anchor="middle" font-family="sans-serif" font-size="11">red rose focal</text>

  <!-- Wildflower/bench detail -->
  <circle cx="785" cy="1095" r="32" fill="#b7c8e6" stroke="#435a83" stroke-width="2"/>
  <text x="785" y="1092" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700">WILDFLOWER</text>
  <text x="785" y="1107" text-anchor="middle" font-family="sans-serif" font-size="11">TUB</text>
  <rect x="735" y="1145" width="100" height="22" rx="5" fill="#8b6a4f"/>
  <text x="785" y="1161" text-anchor="middle" font-family="sans-serif" font-size="11" fill="white">BENCH / PAUSE</text>

  <!-- Legend -->
  <g font-family="sans-serif" font-size="11">
    <text x="18" y="1185">Schematic only — exact parcel placement, utilities, soil, shade and water remain site-fit gates.</text>
  </g>
</svg>